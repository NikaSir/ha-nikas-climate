name: Apply approved HERO surface
on:
  push:
    branches: [codex/uniform-hero-surface]
    paths: [.github/workflows/hero-surface-check.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'NikaSir/ha-nikas-climate' && github.ref == 'refs/heads/codex/uniform-hero-surface'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Add only the active summary surface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('custom_components/nikas_climate/frontend/nikas-climate-entry-154.js')
          source = p.read_text(encoding='utf-8')
          target = 'color-mix(in srgb,var(--card-background-color,#fff) 95%,var(--primary-color,#03a9d9) 5%)'
          rules = [m for m in re.finditer(r'\.u154-summary\{([^{}]*)\}', source) if 'position:relative;isolation:isolate;' in m[1]]
          assert len(rules) == 1, 'Unexpected summary rules'
          m = rules[0]
          assert 'background' not in m[1], 'Surface changed since inspection'
          body = m[1] + ';background:' + target
          p.write_text(source[:m.start(1)] + body + source[m.end(1):], encoding='utf-8')
          PY
      - name: Rebuild and verify production bundle
        run: |
          python3 scripts/build-frontend.py
          python3 scripts/build-frontend.py --check
          python3 tests/test_hero_surface.py
          node --check custom_components/nikas_climate/frontend/nikas-climate-entry-154.js
          node --check custom_components/nikas_climate/frontend/nikas-climate-production.js
          git diff --check
      - name: Commit only source and generated runtime to feature branch
        run: |
          python3 - <<'PY'
          import subprocess
          expected = {'custom_components/nikas_climate/frontend/nikas-climate-entry-154.js', 'custom_components/nikas_climate/frontend/nikas-climate-production.js'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert changed == expected, changed
          PY
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/nikas_climate/frontend/nikas-climate-entry-154.js custom_components/nikas_climate/frontend/nikas-climate-production.js
          git commit -m 'fix(ui): use flat five-percent summary surface without tinting photos'
          git push origin HEAD:refs/heads/codex/uniform-hero-surface
